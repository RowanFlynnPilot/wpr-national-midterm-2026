name: Update results

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *" # hourly; each run makes ~500 civicAPI requests, so keep it gentle
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fresh results only. The House hex layout (public/data/house-hex.json) is committed
      # and regenerated by hand with `npm run hexmap`, so districts never jump between runs.
      - run: python pipeline/fetch.py && python pipeline/build.py
      - run: npm test
      # The build ends by rendering share.png (the Open Graph card) with Playwright's Chromium.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
